%YAML 1.2
---
$id: http://devicetree.org/schemas/soc/thead/thead,th1520-syscon.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: T-HEAD TH1520 SoC System Controller

description: |
  The T-HEAD TH1520 SoC contains multiple system controllers providing
  access to miscellaneous registers, for sideband signal configuration or
  debugging.

  See the SoC system user manual at
  https://openbeagle.org/beaglev-ahead/beaglev-ahead/-/blob/main/docs/TH1520%20System%20User%20Manual.pdf

maintainers:
  - Icenowy Zheng <zhengxingda@iscas.ac.cn>
  - Wei Fu <wefu@redhat.com>
  - Drew Fustini <dfustini@tenstorrent.com>

properties:
  compatible:
    items:
      - enum:
          - thead,th1520-syscon-ao
          - thead,th1520-syscon-ap
          - thead,th1520-syscon-dsp
          - thead,th1520-syscon-misc
          - thead,th1520-syscon-vo
          - thead,th1520-syscon-vi
          - thead,th1520-syscon-vp
      - const: syscon

  reg:
    maxItems: 1

required:
  - compatible
  - reg

additionalProperties: false

examples:
  - |
    soc {
      #address-cells = <2>;
      #size-cells = <2>;

      sysconff@ef018000 {
          compatible = "thead,th1520-syscon-ap", "syscon";
          reg = <0xff 0xef018000 0x0 0x1000>;
      };
    };

...
